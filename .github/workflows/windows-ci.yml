name: CK Stem Splitter Windows CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, build/full-windows-installer]

permissions:
  contents: read

jobs:
  windows-ci:
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Windows build
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build known-good Audition VST3 and tests
        shell: pwsh
        run: cmake --build build --config Release --target CKAuditionOfflineProbe_VST3 CKAuditionOfflineProbeTest CKStemPrototypeRenderTest CKVST3HostLoadTest --parallel

      - name: Stage and validate VST3
        shell: pwsh
        run: |
          $vst = Join-Path $PWD "build\CKAuditionOfflineProbe_artefacts\Release\VST3\CK Stem Splitter.vst3"
          if (!(Test-Path $vst)) { throw "Known-good Audition VST3 was not built." }
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item $vst staging -Recurse -Force

          & build\Release\CKAuditionOfflineProbeTest.exe
          if ($LASTEXITCODE -ne 0) { throw "Offline processor unit test failed." }
          & build\Release\CKVST3HostLoadTest.exe $vst
          if ($LASTEXITCODE -ne 0) { throw "VST3 host-load test failed." }

      - name: Install pinned engine build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "demucs-onnx[mp3]==0.3.0" "onnxruntime==1.29.0" "pyinstaller>=6.10,<7"

      - name: Prewarm bundled vocal model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging\engine\models | Out-Null
          python -m demucs_onnx.cli prewarm `
            --models htdemucs_ft_vocals `
            --precision fp16weights `
            --providers cpu `
            --cache-dir "$PWD\staging\engine\models"
          $modelBytes = (Get-ChildItem staging\engine\models -Recurse -File | Measure-Object Length -Sum).Sum
          if ($modelBytes -lt 100MB) { throw "Bundled model cache is unexpectedly small." }

      - name: Freeze self-contained CPU engine
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onedir `
            --name ckstem-engine `
            --distpath staging\engine `
            --workpath build\pyinstaller `
            --specpath build\pyinstaller `
            --collect-all demucs_onnx `
            --collect-all onnxruntime `
            --collect-all soundfile `
            --collect-all soxr `
            --collect-all huggingface_hub `
            engine\ckstem_engine.py
          if (!(Test-Path staging\engine\ckstem-engine\ckstem-engine.exe)) {
            throw "Frozen CK stem engine was not created."
          }

      - name: Create offline-render test audio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\smoke | Out-Null
          @'
          import math
          import wave
          from pathlib import Path

          sample_rate = 48000
          seconds = 18
          output = Path(r"build/smoke/input.wav")
          with wave.open(str(output), "wb") as wav:
              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)
              frames = bytearray()
              for i in range(sample_rate * seconds):
                  t = i / sample_rate
                  envelope = 0.55 + 0.35 * math.sin(2 * math.pi * 1.7 * t)
                  left = envelope * (math.sin(2 * math.pi * 220 * t) + 0.35 * math.sin(2 * math.pi * 880 * t))
                  right = envelope * (math.sin(2 * math.pi * 247 * t) + 0.30 * math.sin(2 * math.pi * 990 * t))
                  for sample in (left, right):
                      value = max(-32767, min(32767, int(sample * 12000)))
                      frames.extend(value.to_bytes(2, "little", signed=True))
              wav.writeframes(frames)
          '@ | python -

      - name: Test persistent single-pass engine through VST processor
        shell: pwsh
        run: |
          $env:CK_STEM_ENGINE_PATH = (Resolve-Path "staging\engine\ckstem-engine\ckstem-engine.exe").Path
          $env:CK_STEM_MODEL_CACHE = (Resolve-Path "staging\engine\models").Path
          & build\Release\CKStemPrototypeRenderTest.exe `
            build\smoke\input.wav `
            build\smoke\acapella.wav `
            acapella
          if ($LASTEXITCODE -ne 0) { throw "Persistent single-pass VST render failed." }
          if ((Get-Item build\smoke\acapella.wav).Length -lt 100KB) {
            throw "Rendered acapella is unexpectedly small."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\CKStemSplitter.iss
          $installer = "dist\CK-Stem-Splitter-Setup.exe"
          if (!(Test-Path $installer)) { throw "Windows installer was not created." }
          if ((Get-Item $installer).Length -lt 100MB) {
            throw "Installer is unexpectedly small; engine or model may be missing."
          }
          $hash = Get-FileHash $installer -Algorithm SHA256
          "$($hash.Hash)  CK-Stem-Splitter-Setup.exe" | Set-Content "$installer.sha256"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CK-Stem-Splitter-Windows-Installer
          path: |
            dist/CK-Stem-Splitter-Setup.exe
            dist/CK-Stem-Splitter-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
