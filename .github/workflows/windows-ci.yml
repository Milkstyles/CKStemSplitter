name: CK Stem Splitter Windows CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, build/full-windows-installer]

permissions:
  contents: read

jobs:
  windows-ci:
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Windows runner
        shell: pwsh
        run: |
          Write-Host "CK Stem Splitter Windows CI is running"
          cmake --version
          python --version
          Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

      - name: Configure Windows build
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build Audition bridge
        shell: pwsh
        run: cmake --build build --config Release --target CKStemBridge --parallel

      - name: Stage and verify Audition offline panel
        shell: pwsh
        run: |
          $bridge = Join-Path $PWD "build\Release\CKStemBridge.exe"
          if (!(Test-Path $bridge)) {
            $bridge = Get-ChildItem -Path build -Recurse -Filter "CKStemBridge.exe" | Select-Object -First 1 -ExpandProperty FullName
          }
          if (!(Test-Path $bridge)) { throw "Audition selection bridge was not built." }

          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item audition-extension staging\audition-extension -Recurse -Force
          New-Item -ItemType Directory -Force -Path staging\bridge | Out-Null
          Copy-Item $bridge staging\bridge\CKStemBridge.exe -Force

          [xml]$manifest = Get-Content staging\audition-extension\CSXS\manifest.xml
          $auditionHost = $manifest.ExtensionManifest.ExecutionEnvironment.HostList.Host
          if ($auditionHost.Name -ne "AUDT") { throw "CEP panel does not target Adobe Audition." }
          if (!(Select-String -Path staging\audition-extension\jsx\host.jsx -Pattern "app.invokeCommand" -Quiet)) {
            throw "Audition panel is missing host command integration."
          }
          if (!(Select-String -Path staging\audition-extension\main.js -Pattern "saveselectionas" -Quiet)) {
            throw "Audition panel is missing selection export integration."
          }
          if (Select-String -Path staging\audition-extension\main.js -Pattern "clipboard" -Quiet) {
            throw "Obsolete Windows clipboard workflow is still present."
          }

      - name: Install engine build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "demucs-onnx[mp3]==0.3.0" "pyinstaller>=6.10,<7"

      - name: Prewarm bundled vocal model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging\engine\models | Out-Null
          python -m demucs_onnx.cli prewarm `
            --models htdemucs_ft_vocals `
            --precision fp16weights `
            --providers cpu `
            --cache-dir "$PWD\staging\engine\models"

          $modelBytes = (Get-ChildItem staging\engine\models -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "Bundled model bytes: $modelBytes"
          if ($modelBytes -lt 100MB) { throw "Bundled model cache is unexpectedly small." }

      - name: Freeze self-contained AI engine
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onedir `
            --name ckstem-engine `
            --distpath staging\engine `
            --workpath build\pyinstaller `
            --specpath build\pyinstaller `
            --collect-all demucs_onnx `
            --collect-all onnxruntime `
            --collect-all soundfile `
            --collect-all soxr `
            --collect-all huggingface_hub `
            engine\ckstem_engine.py

          $engineExe = "staging\engine\ckstem-engine\ckstem-engine.exe"
          if (!(Test-Path $engineExe)) { throw "Frozen CK stem engine was not created." }
          & $engineExe --help
          & $engineExe list-models

      - name: Create smoke-test audio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\smoke-in | Out-Null
          @'
          import math
          import wave
          from pathlib import Path

          sample_rate = 44100
          seconds = 3
          output = Path(r"build/smoke-in/test.wav")
          with wave.open(str(output), "wb") as wav:
              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)
              frames = bytearray()
              for i in range(sample_rate * seconds):
                  t = i / sample_rate
                  sample = int(0.22 * 32767 * (math.sin(2 * math.pi * 220 * t) + 0.4 * math.sin(2 * math.pi * 880 * t)) / 1.4)
                  b = int(sample).to_bytes(2, "little", signed=True)
                  frames.extend(b)
                  frames.extend(b)
              wav.writeframes(frames)
          print(output.resolve())
          '@ | python -

          & staging\bridge\CKStemBridge.exe verify build\smoke-in\test.wav
          if ($LASTEXITCODE -ne 0) { throw "Selection bridge rejected the smoke-test WAV." }

      - name: Smoke test real stem separation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\smoke-out | Out-Null
          & staging\engine\ckstem-engine\ckstem-engine.exe separate `
            build\smoke-in\test.wav `
            build\smoke-out `
            --model htdemucs_ft_vocals `
            --small `
            --providers cpu `
            --cache-dir "$PWD\staging\engine\models" `
            --karaoke `
            --quiet

          Write-Host "Smoke-test outputs:"
          Get-ChildItem build\smoke-out -Recurse -File | ForEach-Object { Write-Host "$($_.FullName) $($_.Length) bytes" }

          $vocals = Get-ChildItem build\smoke-out -Recurse -Filter vocals.wav | Select-Object -First 1
          $karaoke = Get-ChildItem build\smoke-out -Recurse -Filter karaoke.wav | Select-Object -First 1
          if ($null -eq $vocals) { throw "Smoke test did not create vocals.wav." }
          if ($null -eq $karaoke) { throw "Smoke test did not create karaoke.wav." }
          if ($vocals.Length -lt 1000 -or $karaoke.Length -lt 1000) { throw "Smoke-test stems are unexpectedly small." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler was not found at $iscc" }
          & $iscc installer\CKStemSplitter.iss

          $installer = "dist\CK-Stem-Splitter-Setup.exe"
          if (!(Test-Path $installer)) { throw "Windows installer was not created." }
          $installerBytes = (Get-Item $installer).Length
          Write-Host "Installer bytes: $installerBytes"
          if ($installerBytes -lt 100MB) { throw "Installer is unexpectedly small; bundled model/engine may be missing." }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = Get-FileHash dist\CK-Stem-Splitter-Setup.exe -Algorithm SHA256
          "$($hash.Hash)  CK-Stem-Splitter-Setup.exe" | Set-Content dist\CK-Stem-Splitter-Setup.exe.sha256
          Get-Content dist\CK-Stem-Splitter-Setup.exe.sha256

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CK-Stem-Splitter-Windows-Installer
          path: |
            dist/CK-Stem-Splitter-Setup.exe
            dist/CK-Stem-Splitter-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
